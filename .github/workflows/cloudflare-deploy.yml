name: Cloudflare Production (disabled in Phase 2)

on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Full commit SHA approved for production
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: verdy-match-lab-production
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Validate approved branch and SHA
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: |
          test "$GITHUB_REPOSITORY" = "satochan-ai/verdy-match-lab"
          test "$GITHUB_REF" = "refs/heads/claude/update-2026-09-27"
          [[ "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$EXPECTED_SHA" = "$GITHUB_SHA"
  qa:
    needs: validate
    uses: ./.github/workflows/linux-qa.yml
  deploy:
    # Phase 3 requires a separately approved change removing this fixed guard.
    # Manual dispatch or Secrets registration cannot enable production in Phase 2.
    if: ${{ false }}
    needs: [validate, qa]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      WRANGLER_SEND_METRICS: "false"
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.14.1
          cache: npm
      - run: npm ci
      - run: npm run cf:build
      - name: Verify fixed Worker and clean sources
        run: |
          node -e 'const fs = require("fs"); const config = fs.readFileSync("wrangler.jsonc", "utf8"); if (!/"name"\s*:\s*"verdy-match-lab"/.test(config)) process.exit(1);'
          git diff --exit-code
      - name: Check credentials and deploy with OpenNext
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "Cloudflare API token is missing"; exit 1; }
          test "$CLOUDFLARE_ACCOUNT_ID" = "f96291f02e86ca84f22679b2c34dd13d" || { echo "Cloudflare account is missing or unexpected"; exit 1; }
          npx opennextjs-cloudflare deploy --name verdy-match-lab
